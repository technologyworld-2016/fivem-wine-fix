name: Build FiveM Client (Wine Fix)

on:
  workflow_dispatch:

jobs:
  build_fivem:
    name: FiveM Windows Client
    runs-on: windows-latest
    env:
      PROGRAM: five
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup SDK
        shell: pwsh
        run: |
          # Check available Windows SDK versions
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $sdkPath) {
            $sdks = Get-ChildItem $sdkPath -Directory | Select-Object -ExpandProperty Name
            Write-Output "Available Windows SDK include versions: $sdks"
            $latest = $sdks | Sort-Object -Descending | Select-Object -First 1
            Write-Output "Setting WindowsSDKVersion=$latest"
            echo "WindowsSDKVersion=$latest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          
          # Check for pre-installed .NET reference assemblies
          $refBase = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
          if (-not (Test-Path "$refBase\v4.6\mscorlib.dll")) {
            # Download .NET 4.6 reference assemblies from .nupkg and place in system location
            Write-Output "Installing .NET 4.6 reference assemblies..."
            $nugetDir = "$env:TEMP\nuget"
            mkdir $nugetDir -Force | Out-Null
            $pkgName = "Microsoft.NETFramework.ReferenceAssemblies.net46"
            $nupkgUrl = "https://www.nuget.org/api/v2/package/$pkgName/1.0.0"
            Invoke-WebRequest -Uri $nupkgUrl -OutFile "$nugetDir\pkg.nupkg" -UseBasicParsing
            Expand-Archive -Path "$nugetDir\pkg.nupkg" -DestinationPath "$nugetDir\extracted" -Force
            
            # Try to find where the assemblies are
            $src = $null
            foreach ($c in @("build\.NETFramework\v4.6", "lib\net46", "content")) {
              $p = "$nugetDir\extracted\$c"
              if (Test-Path "$p\mscorlib.dll") { $src = $p; break }
            }
            if (-not $src) {
              $src = Get-ChildItem "$nugetDir\extracted" -Filter "mscorlib.dll" -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
            }
            if ($src) {
              $dest = "$refBase\v4.6"
              mkdir $dest -Force | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
              Write-Output "Copied .NET 4.6 ref assemblies to $dest"
            }
          } else {
            Write-Output ".NET 4.6 reference assemblies already present"
          }
          
          Write-Output "SDK setup done"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 20.12.1 is the last 20.x BEFORE CVE-2024-27980 (spawn EINVAL on .cmd without shell:true)
          node-version: '20.12.1'

      - name: Checkout
        shell: bash
        run: |
          set +e
          ROOT="C:\b"
          ROOT_REPO="$ROOT/$PROGRAM"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=2
          
          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"
          
          mkdir -p "$ROOT_REPO" && cd "$_" || exit 1
          
          git init .
          git config core.symlinks true
          git config windows.appendAtomically false
          git remote add origin https://github.com/technologyworld-2016/fivem-wine-fix.git
          git pull origin wine-win10 --depth=1
          git submodule update --jobs=$JOB_SLOTS --init --depth=1

      - name: Build
        shell: pwsh
        run: |
          cd $env:ROOT_REPO
          Write-Output "Building in $pwd"
          
          # Locate Visual Studio for node-gyp: its PowerShell-based VS detection fails
          # under the trimmed env below, so set VCINSTALLDIR/VSCMD_VER (node-gyp check #1,
          # filesystem-based, no PowerShell) before trimming.
          $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = $null
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          if (-not $vsPath) {
            foreach ($p in @("C:\Program Files\Microsoft Visual Studio\2026\Enterprise", "C:\Program Files\Microsoft Visual Studio\18\Enterprise", "C:\Program Files\Microsoft Visual Studio\2026\BuildTools", "C:\Program Files\Microsoft Visual Studio\18\BuildTools")) {
              if (Test-Path "$p\VC\vcvarsall.bat") { $vsPath = $p; break }
            }
          }
          if ($vsPath) {
            $env:VCINSTALLDIR = "$vsPath\VC"
            $env:VSCMD_VER = "18.0.0.0"
            Write-Output "Set VCINSTALLDIR=$env:VCINSTALLDIR VSCMD_VER=$env:VSCMD_VER for node-gyp"
          } else {
            Write-Output "WARNING: could not locate VS for node-gyp"
          }
          
          # Strip non-essential env vars to avoid Windows CreateProcess buffer overflow (spawn EINVAL)
          # GitHub Actions sets massive env blocks that exceed the 32KB limit
          $keepVars = @("PATH", "PROGRAM", "ROOT_REPO", "ROOT_DEP", "JOB_SLOTS", "WindowsSDKVersion", "SYSTEMROOT", "TEMP", "TMP", "USERNAME", "COMPUTERNAME", "USERPROFILE", "HOMEDRIVE", "HOMEPATH", "NODE_PATH", "OS", "PATHEXT", "COMSPEC", "PROCESSOR_ARCHITECTURE", "NUMBER_OF_PROCESSORS", "VCINSTALLDIR", "VSCMD_VER", "windir", "ProgramFiles", "ProgramFiles(x86)", "CommonProgramFiles", "CommonProgramW6432", "ProgramW6432", "SystemDrive", "PSModulePath", "APPDATA", "LOCALAPPDATA", "PUBLIC", "ProgramData", "ALLUSERSPROFILE")
          $origPathCount = ($env:PATH -split ";").Count

          # Resolve the tools we must keep BEFORE trimming, and preserve their real
          # directories. Pattern-matching for these is unreliable: yarn ships in the npm
          # global prefix (no "Yarn" in the path) and msys64 is not on PATH by default,
          # so a regex guess silently drops them and the failure surfaces much later.
          $forcedPathDirs = @()
          foreach ($tool in @("yarn", "yarn.cmd", "node", "npm.cmd", "git", "sh")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd -and $cmd.Source) {
              $dir = Split-Path $cmd.Source -Parent
              if ($dir -and ($forcedPathDirs -notcontains $dir)) {
                $forcedPathDirs += $dir
                Write-Output "Preserving PATH dir for ${tool}: $dir"
              }
            } else {
              Write-Output "NOTE: $tool not found on the pre-trim PATH"
            }
          }
          # prebuild_natives.cmd runs `sh build.sh`, so MSYS must survive the trim too.
          foreach ($p in @("C:\msys64\usr\bin", "C:\msys64\mingw64\bin")) {
            if ((Test-Path $p) -and ($forcedPathDirs -notcontains $p)) { $forcedPathDirs += $p }
          }

          $envKeys = @(Get-ChildItem Env: | Select-Object -ExpandProperty Name)
          foreach ($key in $envKeys) { if ($key -notin $keepVars) { Remove-Item "Env:$key" -ErrorAction SilentlyContinue } }
          # Filter PATH: keep system + git + msys2 + node + python + msbuild paths
          # NOTE: these are regexes, so a literal backslash is "\\". The old Yarn entry
          # used "\\\\" (matching a *doubled* backslash, which never occurs), so Yarn was
          # silently trimmed and run_prebuild.ps1 died with "Could not execute `yarn`".
          # Match Yarn/npm anywhere in the path rather than under a hardcoded username.
          $essentialPathPatterns = @("^C:\\Windows", "^C:\\Program Files\\Git", "^C:\\Program Files\\PowerShell", "^C:\\msys64", "^C:\\hostedtoolcache", "^C:\\Program Files.*MSBuild", "^C:\\Program Files.*Microsoft Visual", "^C:\\Program Files \\(x86\\)\\Microsoft SDKs", "^C:\\Program Files \\(x86\\)\\Windows Kits", "\\\\Yarn\\\\", "\\\\npm", "\\\\nodejs")
          $pathEntries = ($env:PATH -split ";") | Where-Object { 
            $keep = $false
            foreach ($pat in $essentialPathPatterns) { if ($_ -match $pat) { $keep = $true; break } }
            $keep
          } | Select-Object -Unique
          if ($pathEntries.Count -lt 5) {
            $pathEntries = @("C:\Windows\system32", "C:\Windows", "C:\msys64\usr\bin", "C:\hostedtoolcache\windows\node\20.12.1\x64", "C:\Program Files\PowerShell\7")
          }
          # Put the resolved tool dirs first so they win regardless of the patterns above.
          $pathEntries = @($forcedPathDirs + $pathEntries) | Select-Object -Unique
          $env:PATH = [string]::Join(";", $pathEntries)
          Write-Output "Trimmed PATH from $origPathCount to $($pathEntries.Count) entries"
          $pathEntries | ForEach-Object { Write-Output "  PATH: $_" }

          # The trim previously ate yarn, which only surfaced ~4 minutes later as
          # "PREBUILD : error YARN". Fail here instead, where the cause is obvious.
          # sh/pacman are only warnings: prebuild_natives.cmd prepends C:\msys64\usr\bin
          # to PATH itself, so they can legitimately be absent here.
          foreach ($tool in @("yarn", "node", "git", "sh", "pacman")) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) {
              Write-Output "OK: $tool -> $($found.Source)"
            } elseif ($tool -in @("sh", "pacman")) {
              Write-Output "NOTE: $tool not on trimmed PATH (prebuild_natives.cmd adds msys64 itself)"
            } else {
              Write-Output "::error::$tool not found on trimmed PATH"
              exit 1
            }
          }
          
          # Pre-place Node 20 at ext/native-doc-gen/node.exe with future timestamp
          # build.sh's curl -z won't overwrite a newer file, so this prevents download failures
          $bundledNodeDir = ".\ext\native-doc-gen"
          $node20Dir = "C:\hostedtoolcache\windows\node\20.12.1\x64"
          if (Test-Path "$node20Dir\node.exe") {
            New-Item -ItemType Directory -Force $bundledNodeDir | Out-Null
            Copy-Item "$node20Dir\node.exe" "$bundledNodeDir\node.exe" -Force
            (Get-ChildItem "$bundledNodeDir\node.exe").LastWriteTime = Get-Date "2099-01-01"
            Write-Output "Pre-placed Node 20 at $bundledNodeDir\node.exe with 2099 timestamp"
          }
          
          # DIAGNOSTIC: test spawn with copied node.exe
          Write-Output "=== DIAGNOSTIC: testing spawn with copied node.exe ==="
          & "$bundledNodeDir\node.exe" -e "const c=require('child_process'); try { const r=c.spawnSync(process.execPath,['-e','console.log(process.version)'],{encoding:'utf8'}); console.log('SPAWN PIPE OK:', JSON.stringify(r.stdout)); } catch(e) { console.log('SPAWN PIPE FAILED:', e.code, e.message); }" 2>&1
          & "$bundledNodeDir\node.exe" -e "const c=require('child_process'); try { const r=c.spawnSync(process.execPath,['-e','console.log(process.version)'],{encoding:'utf8',stdio:'inherit'}); console.log('SPAWN INHERIT OK'); } catch(e) { console.log('SPAWN INHERIT FAILED:', e.code, e.message); }" 2>&1
          & "$bundledNodeDir\node.exe" -e "const c=require('child_process'); try { const r=c.spawnSync('cmd.exe',['/c','echo','hi'],{encoding:'utf8',stdio:'inherit'}); console.log('SPAWN CMD INHERIT OK'); } catch(e) { console.log('SPAWN CMD INHERIT FAILED:', e.code, e.message); }" 2>&1
          # CVE-2024-27980 test: spawn a .cmd directly WITHOUT shell:true (what node-gyp-build bin.js:29 does)
          Set-Content -Path "$bundledNodeDir\spawntest.cmd" -Value "@echo SPAWNCMD OK"
          & "$bundledNodeDir\node.exe" -e "const c=require('child_process'); try { const r=c.spawnSync(process.argv[1],[],{encoding:'utf8'}); console.log('SPAWN CMD NO-SHELL OK:', JSON.stringify(r.stdout)); } catch(e) { console.log('SPAWN CMD NO-SHELL FAILED:', e.code, e.message); }" "$bundledNodeDir\spawntest.cmd" 2>&1
          Write-Output "=== DIAGNOSTIC done ==="
          
          .\prebuild.cmd
          
          .\fxd.ps1 gen -game $env:PROGRAM
          
          # Remove nui-core from solution (requires ATL build tools not available on runner)
          $slnFile = "code\build\$env:PROGRAM\CitizenMP.sln"
          if (Test-Path $slnFile) {
            $lines = Get-Content $slnFile
            $newLines = @()
            $skip = $false
            $nuiCoreGuid = $null
            $countBefore = ($lines | Where-Object { $_ -match "nui-core" } | Measure-Object).Count
            foreach ($line in $lines) {
              if ($line -match 'Project\(".*"\) = "nui-core"') {
                $skip = $true
                # Extract the GUID from the project line
                if ($line -match '\{([A-F0-9-]+)\}"$') { $nuiCoreGuid = $matches[1] }
                continue
              }
              if ($skip -and $line.Trim() -eq "EndProject") { $skip = $false; continue }
              if (-not $skip) { $newLines += $line }
            }
            # Also remove GlobalSection lines referencing nui-core's GUID
            if ($nuiCoreGuid) {
              $newLines = $newLines | Where-Object { $_ -notmatch "\{$nuiCoreGuid\}" }
            }
            $newLines | Set-Content $slnFile
            $countAfter = ((Get-Content $slnFile) | Where-Object { $_ -match "nui-core" } | Measure-Object).Count
            Write-Output "Removed nui-core from solution ($countBefore -> $countAfter)"
          } else {
            Write-Output "Solution file not found at $slnFile"
          }
          
          # Also delete nui-core .vcxproj files so MSBuild can't find them
          $nuiCoreProj = "code\build\$env:PROGRAM\nui-core.vcxproj"
          if (Test-Path $nuiCoreProj) {
            Remove-Item "$nuiCoreProj" -Force
            Remove-Item "$nuiCoreProj.filters" -Force -ErrorAction SilentlyContinue
            Write-Output "Deleted nui-core .vcxproj files"
          }
          
          cd code\build\$env:PROGRAM
          
          # Get Windows SDK version from env or use a fallback
          $sdkVer = $env:WindowsSDKVersion
          if (-not $sdkVer) { $sdkVer = "10.0.22621.0" }
          # Remove trailing backslash if present
          $sdkVer = $sdkVer.TrimEnd('\')
          Write-Output "Using Windows SDK version: $sdkVer"
          
          MSBuild.exe CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:Configuration=release -p:Platform=x64 -p:WindowsTargetPlatformVersion=$sdkVer -maxcpucount:2 -v:q -fl1 "-flp1:logfile=errors.log;errorsonly"
          $MSBUILD_ERROR = $LASTEXITCODE
          
          if ($MSBUILD_ERROR -eq 0) {
            Write-Output "Successfully built $env:PROGRAM"
          } else {
            Write-Output "::error::Failed to build $env:PROGRAM, MSBuild returned with error code: $MSBUILD_ERROR"
            if (Test-Path errors.log) {
              Get-Content errors.log | ForEach-Object { Write-Output $_ }
            }
            exit $MSBUILD_ERROR
          }

      - name: Upload FiveM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-WineFix
          path: |
            ${{ env.ROOT_REPO }}/code/build/five/bin/
            ${{ env.ROOT_REPO }}/code/build/five/output/
          if-no-files-found: warn
