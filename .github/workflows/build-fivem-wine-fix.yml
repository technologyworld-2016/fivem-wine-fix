name: Build FiveM Client (Wine Fix)

on:
  workflow_dispatch:

jobs:
  build_fivem:
    name: FiveM Windows Client
    runs-on: windows-latest
    env:
      PROGRAM: five
      PLATFORM: windows
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Checkout
        shell: bash
        run: |
          ROOT="C:\b"
          ROOT_REPO="$ROOT/$PROGRAM"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=$(nproc --all);
          
          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"
          
          mkdir -p "$ROOT_REPO" && cd "$_" || exit 1
          
          git init .
          git config core.symlinks true
          git remote add origin https://github.com/technologyworld-2016/fivem-wine-fix.git
          git pull origin wine-win10 --depth=1
          git submodule update --jobs=$JOB_SLOTS --init --depth=1
        
      - name: Dependencies
        shell: bash
        run: |
          mkdir -p "$ROOT_DEP" && cd "$_" || exit 1
      
      - name: Compile
        shell: bash
        run: |
          cd "$ROOT_REPO"
          
          # Find MSBuild using vswhere (more robust than hardcoded path)
          MSBUILD=$(vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe -products * | grep -E 'MSBuild\.exe$' | head -1)
          echo "Found MSBuild at: $MSBUILD"
          
          if [ -z "$MSBUILD" ]; then
            # Fallback: try from PATH
            MSBUILD="MSBuild.exe"
          fi
          
          pwsh ./fxd.ps1 get-chrome || true
          ./prebuild.cmd || true
          
          pwsh ./fxd.ps1 gen -game $PROGRAM
          
          cd code/build/$PROGRAM
          
          "$MSBUILD" CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:preferredtoolarchitecture=x64 -p:configuration=release -maxcpucount:4 -v:q -fl1 "-flp1:logfile=errors.log;errorsonly"
          MSBUILD_ERROR=$?
          
          if [[ $MSBUILD_ERROR -eq 0 ]]; then
            echo "Successfully built $PROGRAM"
          else
            RED=$'\e[31m'
            echo "::error::Failed to build $PROGRAM, MSBuild returned with error code: $MSBUILD_ERROR"
            if [ -f errors.log ]; then
              while IFS= read -r LINE; do echo "$RED$LINE"; done < errors.log
            fi
            exit $MSBUILD_ERROR
          fi

      - name: Upload FiveM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-WineFix
          path: |
            ${{ env.ROOT_REPO }}/code/build/five/bin/
            ${{ env.ROOT_REPO }}/code/build/five/output/
          if-no-files-found: warn
