name: Build FiveM Client (Wine Fix)

on:
  workflow_dispatch:

jobs:
  build_fivem:
    name: FiveM Windows Client
    runs-on: windows-latest
    env:
      PROGRAM: five
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup SDK
        shell: pwsh
        run: |
          # Check available Windows SDK versions
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $sdkPath) {
            $sdks = Get-ChildItem $sdkPath -Directory | Select-Object -ExpandProperty Name
            Write-Output "Available Windows SDK include versions: $sdks"
            $latest = $sdks | Sort-Object -Descending | Select-Object -First 1
            Write-Output "Setting WindowsSDKVersion=$latest"
            echo "WindowsSDKVersion=$latest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          
          # Check for pre-installed .NET reference assemblies
          $checkPaths = @(
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.1",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          )
          $foundRef = $null
          foreach ($p in $checkPaths) {
            if (Test-Path "$p\mscorlib.dll") {
              Write-Output "Found reference assemblies at: $p"
              $foundRef = $p
              break
            }
          }
          
          # Download .NET 4.6 reference assemblies from the .nupkg directly
          $nugetDir = "$env:TEMP\nuget"
          mkdir $nugetDir -Force | Out-Null
          $pkgName = "Microsoft.NETFramework.ReferenceAssemblies.net46"
          $pkgVer = "1.0.0"
          $nupkgUrl = "https://www.nuget.org/api/v2/package/$pkgName/$pkgVer"
          $nupkgFile = "$nugetDir\$pkgName.$pkgVer.nupkg"
          $extractDir = "$nugetDir\refasm"
          
          Write-Output "Downloading $pkgName v$pkgVer..."
          Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkgFile -UseBasicParsing
          
          Write-Output "Extracting NuGet package..."
          Expand-Archive -Path $nupkgFile -DestinationPath $extractDir -Force
          
          # Find the reference assemblies directory inside the extracted package
          $asmDir = $null
          $candidates = @(
            "$extractDir\build\.NETFramework\v4.6",
            "$extractDir\lib\net46",
            "$extractDir\content\netframework\v4.6"
          )
          foreach ($c in $candidates) {
            if (Test-Path "$c\mscorlib.dll") {
              $asmDir = $c
              break
            }
          }
          
          if ($asmDir) {
            Write-Output "Found .NET 4.6 reference assemblies at: $asmDir"
            echo "DOTNET46_PATH=$asmDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($foundRef) {
            Write-Output "Using pre-installed reference assemblies at: $foundRef"
            echo "DOTNET46_PATH=$foundRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Output "WARNING: Could not find .NET 4.6 reference assemblies anywhere"
            Write-Output "Contents of extracted package:"
            Get-ChildItem -Recurse $extractDir | Select-Object -First 100 FullName
          }
          Write-Output "SDK setup done"

      - name: Checkout
        shell: bash
        run: |
          set +e
          ROOT="C:\b"
          ROOT_REPO="$ROOT/$PROGRAM"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=2
          
          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"
          
          mkdir -p "$ROOT_REPO" && cd "$_" || exit 1
          
          git init .
          git config core.symlinks true
          git config windows.appendAtomically false
          git remote add origin https://github.com/technologyworld-2016/fivem-wine-fix.git
          git pull origin wine-win10 --depth=1
          git submodule update --jobs=$JOB_SLOTS --init --depth=1

      - name: Build
        shell: pwsh
        run: |
          cd $env:ROOT_REPO
          Write-Output "Building in $pwd"
          
          .\fxd.ps1 get-chrome
          .\prebuild.cmd
          
          .\fxd.ps1 gen -game $env:PROGRAM
          
          cd code\build\$env:PROGRAM
          
          # Get Windows SDK version from env or use a fallback
          $sdkVer = $env:WindowsSDKVersion
          if (-not $sdkVer) { $sdkVer = "10.0.22621.0" }
          # Remove trailing backslash if present
          $sdkVer = $sdkVer.TrimEnd('\')
          Write-Output "Using Windows SDK version: $sdkVer"
          
          # Use FrameworkPathOverride for .NET 4.6 if we have it
          $dotnet46Path = $env:DOTNET46_PATH
          $fwOverride = ""
          if ($dotnet46Path -and (Test-Path $dotnet46Path)) {
            $fwOverride = "-p:FrameworkPathOverride=`"$dotnet46Path`""
            Write-Output "Using .NET 4.6 from: $dotnet46Path"
          } else {
            Write-Output "WARNING: No .NET 4.6 override path set, may fail"
          }
          
          MSBuild.exe CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:Configuration=release -p:Platform=x64 -p:WindowsTargetPlatformVersion=$sdkVer $fwOverride -maxcpucount:2 -v:q -fl1 "-flp1:logfile=errors.log;errorsonly"
          $MSBUILD_ERROR = $LASTEXITCODE
          
          if ($MSBUILD_ERROR -eq 0) {
            Write-Output "Successfully built $env:PROGRAM"
          } else {
            Write-Output "::error::Failed to build $env:PROGRAM, MSBuild returned with error code: $MSBUILD_ERROR"
            if (Test-Path errors.log) {
              Get-Content errors.log | ForEach-Object { Write-Output $_ }
            }
            exit $MSBUILD_ERROR
          }

      - name: Upload FiveM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-WineFix
          path: |
            ${{ env.ROOT_REPO }}/code/build/five/bin/
            ${{ env.ROOT_REPO }}/code/build/five/output/
          if-no-files-found: warn
