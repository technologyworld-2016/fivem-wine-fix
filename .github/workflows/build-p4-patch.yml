name: Build P4 ANGLE Backend Patch

on:
  workflow_dispatch:
  push:
    branches:
      - p4-angle-backend

jobs:
  build-fivem:
    name: Build FiveM with P4 patch
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Yarn
            ext\native-doc-tooling\node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('ext/native-doc-tooling/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      
      - name: Setup build environment
        shell: pwsh
        run: |
          # Install Python setuptools
          pip install setuptools
      
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      
      - name: Setup Visual Studio environment variables
        shell: pwsh
        run: |
          # Set VS environment for node-gyp
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio path: $vsPath"
          echo "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GYP_MSVS_OVERRIDE_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
      - name: Download Chrome
        shell: pwsh
        run: |
          .\fxd.ps1 get-chrome
          
      - name: Prebuild natives
        shell: cmd
        timeout-minutes: 30
        run: |
          .\prebuild.cmd
          
      - name: Generate project
        shell: pwsh
        run: |
          .\fxd.ps1 gen -game five
          
      - name: Build FiveM
        shell: cmd
        run: |
          cd code\build\five
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MsBuild.exe" CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:preferredtoolarchitecture=x64 -p:configuration=release -maxcpucount:4 -v:q
          
      - name: Upload nui-core.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: fivem-p4-nui-core
          path: code/bin/five/release/nui-core.dll
          if-no-files-found: error
          
      - name: Upload full build artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: fivem-p4-full-build
          path: |
            code/bin/five/release/*.dll
            code/bin/five/release/*.exe
          if-no-files-found: warn
